[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recursive-resolver"
version = "0.1.0"
description = "Pure-Python DNS recursive resolver — iterates from root servers, bypassing all caches"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Sylvain Zimmer", email = "sylvain@sylvainzimmer.com" },
]
keywords = ["dns", "resolver", "recursive", "nameserver", "iterative", "root-servers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "dnspython>=2.6",
]

[project.urls]
Homepage = "https://github.com/sylvinus/recursive-resolver"
Repository = "https://github.com/sylvinus/recursive-resolver"
Issues = "https://github.com/sylvinus/recursive-resolver/issues"

[project.scripts]
recursive-resolver = "recursive_resolver.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recursive_resolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require network access (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
